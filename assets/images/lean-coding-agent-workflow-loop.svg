<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Lean Coding Agent works: everyday requests run directly; named workflows go plan, approve, implement test-first, independent review.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f78166"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/>
    </marker>
  </defs>

  <rect width="960" height="390" rx="18" fill="url(#bg)" stroke="#30363d"/>

  <!-- Title -->
  <text x="40" y="46" font-size="22" font-weight="700" fill="#f0f6fc">How Lean Coding Agent works</text>

  <!-- Lane 2 (shown second): everyday request -->
  <g transform="translate(0,214)">
  <text x="40" y="104" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1">EVERYDAY REQUEST</text>
  <g filter="url(#shadow)">
    <rect x="40" y="114" width="150" height="40" rx="20" fill="#21262d" stroke="#30363d"/>
    <rect x="230" y="114" width="340" height="40" rx="10" fill="#21262d" stroke="#30363d"/>
    <rect x="800" y="114" width="120" height="40" rx="20" fill="#0f2e1b" stroke="#2ea043"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="115" y="139" fill="#c9d1d9">"Fix this typo"</text>
    <text x="400" y="139" fill="#c9d1d9">Agent handles it directly</text>
    <text x="860" y="139" font-weight="700" fill="#3fb950">Done ✓</text>
  </g>
  <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="134" x2="227" y2="134"/>
    <line x1="570" y1="134" x2="797" y2="134" stroke-dasharray="5 5"/>
  </g>
  <text x="684" y="126" font-size="12" text-anchor="middle" fill="#8b949e">no plan, no subagents</text>
  </g>

  <line x1="40" y1="296" x2="920" y2="296" stroke="#30363d" stroke-dasharray="2 6"/>

  <!-- Lane 1 (shown first): named workflow -->
  <g transform="translate(0,-128)">
  <text x="40" y="208" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1">NAMED WORKFLOW</text>
  <text x="920" y="208" font-size="13" text-anchor="end" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">/workflow-feature-development</text>

  <g filter="url(#shadow)">
    <rect x="40"  y="236" width="150" height="88" rx="12" fill="#0c2d4a" stroke="#388bfd"/>
    <rect x="230" y="236" width="150" height="88" rx="12" fill="#3a2c06" stroke="#e3b341"/>
    <rect x="420" y="236" width="150" height="88" rx="12" fill="#0f2e1b" stroke="#2ea043"/>
    <rect x="610" y="236" width="150" height="88" rx="12" fill="#2b1748" stroke="#a371f7"/>
    <rect x="800" y="258" width="120" height="44" rx="22" fill="#0f2e1b" stroke="#2ea043"/>
  </g>

  <!-- Step badges -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#0d1117">
    <circle cx="62"  cy="258" r="11" fill="#388bfd"/><text x="62"  y="262">1</text>
    <circle cx="252" cy="258" r="11" fill="#e3b341"/><text x="252" y="262">2</text>
    <circle cx="442" cy="258" r="11" fill="#2ea043"/><text x="442" y="262">3</text>
    <circle cx="632" cy="258" r="11" fill="#a371f7"/><text x="632" y="262">4</text>
  </g>

  <g text-anchor="middle">
    <text x="115" y="285" font-size="15" font-weight="700" fill="#79c0ff">Plan</text>
    <text x="115" y="304" font-size="12" fill="#8b949e">strong model</text>
    <text x="115" y="318" font-size="12" fill="#8b949e">asks, then writes it</text>

    <text x="305" y="285" font-size="15" font-weight="700" fill="#e3b341">You approve</text>
    <text x="305" y="304" font-size="12" fill="#8b949e">no code is written</text>
    <text x="305" y="318" font-size="12" fill="#8b949e">before this</text>

    <text x="495" y="285" font-size="15" font-weight="700" fill="#3fb950">Implement</text>
    <text x="495" y="304" font-size="12" fill="#8b949e">cheap model, test-first</text>
    <text x="495" y="318" font-size="12" fill="#8b949e">one behavior at a time</text>

    <text x="685" y="285" font-size="13" font-weight="700" fill="#d2a8ff">Independent review</text>
    <text x="685" y="304" font-size="12" fill="#8b949e">strong model</text>
    <text x="685" y="318" font-size="12" fill="#8b949e">fresh context</text>

    <text x="860" y="277" font-size="14" font-weight="700" fill="#3fb950">Verified ✓</text>
    <text x="860" y="293" font-size="11" fill="#8b949e">tests + checks pass</text>
  </g>

  <!-- Forward arrows -->
  <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="280" x2="227" y2="280"/>
    <line x1="380" y1="280" x2="417" y2="280"/>
    <line x1="570" y1="280" x2="607" y2="280"/>
    <line x1="760" y1="280" x2="797" y2="280"/>
  </g>

  <!-- Loops -->
  <path d="M305,324 C305,362 115,362 115,327" stroke="#e3b341" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowYellow)"/>
  <text x="210" y="372" font-size="12" text-anchor="middle" fill="#e3b341">revise</text>

  <path d="M685,324 C685,362 495,362 495,327" stroke="#f78166" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="590" y="372" font-size="12" text-anchor="middle" fill="#f78166">findings → fix · stops after 3 failed attempts</text>

  </g>

  <!-- Footer: written records -->
  <g transform="translate(0,-138)">
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
    <rect x="40"  y="392" width="128" height="26" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="104" y="409" text-anchor="middle" fill="#c9d1d9">plan_*.md</text>
    <rect x="176" y="392" width="196" height="26" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="274" y="409" text-anchor="middle" fill="#c9d1d9">implementation_*.md</text>
    <rect x="380" y="392" width="176" height="26" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="468" y="409" text-anchor="middle" fill="#c9d1d9">review_*_pass_N.md</text>
  </g>
  <text x="572" y="410" font-size="13" fill="#8b949e">written records that survive context compaction</text>
  </g>
</svg>
